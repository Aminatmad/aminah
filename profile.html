<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a3312">
    <title>AMANAH - Профиль</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
   
    <!-- PWA / установка на домашний экран -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a3312">

    <!-- Иконки для разных устройств -->
    <link rel="icon" type="image/jpg" href="images/ico-192.jpg">
    <link rel="apple-touch-icon" href="images/ico-192.jpg">
   
    <!-- Для iOS (чтобы открывалось как приложение) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AMANAH">
</head>
<body>
    <div class="container">
       <!-- ШАПКА С КОМПАСОМ -->
        <header class="header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 20px;">
            <!-- ЛЕВАЯ ЧАСТЬ: ИКОНКА КОМПАСА -->
            <div class="header-qibla" onclick="openQiblaModal()" style="flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer;">
                <div class="compass-icon-mini">
                    <svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="#d4af37" stroke-width="2"/>
                        <path d="M20 6 L25 20 L20 17 L15 20 Z" fill="#d4af37"/>
                        <circle cx="20" cy="20" r="3" fill="#1a3312"/>
                    </svg>
                </div>
                <span style="font-size: 10px; color: var(--gold); font-weight: bold; margin-top: 4px;">КИБЛА</span>
            </div>

            <!-- ЦЕНТР: ЛОГОТИП -->
            <div class="header-center" onclick="window.location.href='index.html'" style="flex: 2; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer;">
                <div class="logo-img" style="margin-bottom: 5px; width: 50px; height: 50px; background-image: url('images/ico-180.png');"></div>
                <span class="logo-text" style="font-size: 20px; line-height: 1;">AMANAH</span>
                <span class="logo-subtext" style="font-size: 8px; margin-top: 2px;">ТВОЯ РЕЛИГИЯ — ТВОЙ АМАНАТ</span>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ: ВРЕМЯ НАМАЗА -->
            <div class="header-prayer" onclick="document.getElementById('prayer-modal').classList.add('active')" style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer;">
                <span id="next-prayer-name" style="font-size: 11px; color: var(--gold); font-weight: bold; text-transform: uppercase;">Намаз</span>
                <span id="next-prayer-time" style="font-size: 20px; color: var(--text-light); font-weight: bold;">--:--</span>
            </div>
        </header>

        <!-- ПРОФИЛЬ -->
        <section id="profile-page" class="page-section active">
            <div class="back-btn" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> На главную
            </div>
            <h2 class="section-title">Мой прогресс</h2>
            <div id="continue-block"></div>
            <div id="profile-content"></div>
        </section>
    </div>

    <!-- Модалка PRO -->
    <div class="modal-overlay" id="pro-modal">
        <div class="modal-content">
            <h3>PRO Подписка</h3>
            <p>Этот урок доступен только с PRO-подпиской. Откройте все уроки всех книг.</p>
            <button class="modal-btn" onclick="activatePro()">Активировать демо-PRO</button>
            <button class="modal-btn" style="background: transparent; color: #666; box-shadow: none;" onclick="closeProModal()">Закрыть</button>
        </div>
    </div>

    <!-- МОДАЛКА БОЛЬШОГО КОМПАСА -->
    <div class="modal-overlay" id="qibla-modal">
        <div class="modal-content" style="background: var(--bg-color); border: 2px solid var(--gold); color: white; max-width: 360px; padding: 20px;">
            <h3 style="color: var(--gold); margin-bottom: 5px;">Направление Киблы</h3>
            <p id="qibla-direction-text" style="color: #ddd; font-size: 14px; margin-bottom: 20px;">Поверните телефон...</p>
           
            <!-- Контейнер для компаса -->
        <div class="compass-container">
                <!-- Неподвижная зеленая метка сверху -->
                <div class="compass-target"></div>

                <!-- Вращающаяся шкала с Каабой (id="compass-dial") -->
                <div class="compass-dial" id="compass-dial">
                    <svg viewBox="0 0 200 200" style="width: 100%; height: 100%; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));">
                        <!-- Внешнее белое кольцо -->
                        <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#d4af37" stroke-width="2"/>
                        <!-- Внутренний бежевый круг -->
                        <circle cx="100" cy="100" r="75" fill="#f4f1e6" stroke="#d4af37" stroke-width="2"/>
                       
                        <!-- Буквы -->
                        <text x="100" y="40" fill="#1a3312" font-size="18" font-weight="bold" text-anchor="middle">С</text>
                        <text x="155" y="106" fill="#1a3312" font-size="18" font-weight="bold" text-anchor="middle">В</text>
                        <text x="100" y="172" fill="#1a3312" font-size="18" font-weight="bold" text-anchor="middle">Ю</text>
                        <text x="45" y="106" fill="#1a3312" font-size="18" font-weight="bold" text-anchor="middle">З</text>

                        <!-- ТВОИ ГРАДУСЫ -->
                        <text x="100" y="18" fill="#666" font-size="8" text-anchor="middle">0°</text>
                        <text x="185" y="105" fill="#666" font-size="8" text-anchor="middle">90°</text>
                        <text x="100" y="188" fill="#666" font-size="8" text-anchor="middle">180°</text>
                        <text x="15" y="105" fill="#666" font-size="8" text-anchor="middle">270°</text>

                        <!-- ИКОНКА КААБЫ (Прикреплена к 0°, будет крутиться вместе со шкалой) -->
                        <!-- Белый кружок-подложка для Каабы, чтобы она выделялась на фоне -->
                        <circle cx="100" cy="100" r="18" fill="#ffffff" stroke="#d4af37" stroke-width="2"/>
                        <!-- Сама Кааба (черный квадрат с золотой полоской) -->
                        <rect x="90" y="90" width="20" height="20" rx="2" fill="#1a1a1a"/>
                        <rect x="90" y="97" width="20" height="4" fill="#d4af37"/>
                        <!-- Золотая стрелочка, указывающая от Каабы к краю -->
                        <path d="M95 80 L100 65 L105 80 Z" fill="#d4af37"/>
                    </svg>
                </div>
            </div> 

           
            <div style="margin-top: 15px; font-size: 14px;">
                Угол Киблы: <strong id="qibla-angle-text" style="color: var(--gold);">--</strong>°
            </div>
            <div id="gps-debug-text" style="font-size: 11px; color: #888; margin-top: 5px;"></div>
            <button class="modal-btn" style="margin-top: 20px;" onclick="closeQiblaModal()">Закрыть</button>
        </div>
    </div>

    <!-- МОДАЛКА ВСЕХ НАМАЗОВ (Теперь она отдельно и снаружи!) -->
    <div class="modal-overlay" id="prayer-modal">
        <div class="modal-content" style="background: var(--bg-color); border: 2px solid var(--gold); color: white; max-width: 360px; padding: 20px;">
            <h3 style="color: var(--gold); margin-bottom: 20px;">Намазы на сегодня</h3>
            <div id="prayer-list-container" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                <!-- Сюда скрипт вставит список намазов -->
            </div>
            <button class="modal-btn" onclick="document.getElementById('prayer-modal').classList.remove('active')">Закрыть</button>
        </div>
    </div>

    <div class="mosque-footer"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Главная</span>
        </a>
        <a href="catalog.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Знания</span>
        </a>
        <a href="dua.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span>Дуа</span></a>
        <a href="profile.html" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Профиль</span></a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Ждем полной загрузки страницы и запускаем отрисовку профиля
        window.addEventListener('DOMContentLoaded', () => {
            // Проверяем, что функция существует, чтобы избежать ошибок
            if (typeof renderProfile === 'function') {
                renderProfile();
            } else {
                console.error("Функция renderProfile не найдена! Проверьте js/app.js");
            }
        });
    </script>
</body>
</html>
